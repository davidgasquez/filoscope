name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - SKILL.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p "$RUNNER_TEMP/filoscope-site"
          cp site/index.html SKILL.md "$RUNNER_TEMP/filoscope-site/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/filoscope-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
